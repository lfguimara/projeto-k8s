apiVersion: apps/v1
kind: Deployment
metadata:
  name: arquivos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arquivos
  template:
    metadata:
      labels:
        app: arquivos
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          volumeMounts:
            - name: dados
              mountPath: /usr/share/nginx/html
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: app-data
